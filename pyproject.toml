[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyguide"
version = "0.1.1"
requires-python = ">=3.12"
description = "Tools for CRISPRi/a gRNA work"
license = { text = "MIT" }
authors = [
    { name = "Parker Grosjean", email = "parker.grosjean@gmail.com" },
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "mygene>=3.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
app = ["streamlit"]

[project.scripts]
pyguide-order = "pyguide.guide:main"
pyguide-collate = "pyguide.pool:main"
pyguide-collate-seq = "pyguide.collate_seq:main"
pyguide-batch-retest = "pyguide.batch_retest:main"
pyguide-check-seq = "pyguide.check_seq:main"

[project.urls]
Homepage = "https://github.com/pgrosjean/pyguide"

[tool.hatch.build.targets.wheel]
packages = ["pyguide"]
